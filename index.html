<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Faccini Odontologia - Sistema</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fdfdfd;
      margin: 0;
      padding: 0;
    }
    .login-container {
      width: 90%;
      max-width: 400px;
      border: 2px solid #b8860b;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 8px;
      padding: 20px;
      margin: 100px auto;
    }
    .login-box {
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .login-box h1 {
      color: #b8860b;
      margin-bottom: 20px;
    }
    .login-box input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }
    .login-box button {
      width: 100%;
      padding: 12px;
      background: #b8860b;
      color: #fff;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }
    .hidden { display: none; }
    header {
      background-color: #333333;
      color: #fff;
      text-align: center;
      padding: 15px;
    }
    header h1 {
      margin: 0;
      color: #b8860b;
      background-color: #fff;
      padding: 10px;
      border-radius: 5px;
      display: inline-block;
    }
    h2 {
      color: #b8860b;
    }
    table {
      width: 100%;
      margin: 10px auto;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 6px;
    }
    th {
      background-color: #f0f0f0;
    }
    .section {
      margin: 20px auto;
      width: 95%;
    }
    button {
      margin-top: 10px;
      padding: 8px 12px;
      background: #b8860b;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="loginPage" class="login-container">
    <div class="login-box">
      <h1>Faccini Odontologia</h1>
      <input type="text" id="username" placeholder="Digite seu nome">
      <input type="password" id="password" placeholder="Digite sua senha">
      <button type="button" onclick="login()">Entrar</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <header>
      <h1>Faccini Odontologia - Dashboard</h1>
    </header>

    <div class="section">
      <h2>Pacientes</h2>
      <table id="patientsTable">
        <tr><th>ID</th><th>Nome</th><th>Telefone</th><th>Observações</th></tr>
      </table>
      <button onclick="addPatient()">Adicionar Paciente</button>
    </div>

    <div class="section">
      <h2>Medicamentos</h2>
      <table id="medicationsTable">
        <tr><th>Medicamento</th><th>Quantidade</th><th>Validade</th><th>Custo</th></tr>
      </table>
      <button onclick="addMedication()">Adicionar Medicamento</button>
    </div>

    <div class="section">
      <h2>Materiais</h2>
      <table id="materialsTable">
        <tr><th>Item</th><th>Quantidade</th><th>Local</th><th>Custo</th></tr>
      </table>
      <button onclick="addMaterial()">Adicionar Material</button>
    </div>

    <div class="section">
      <h2>Resumo Financeiro</h2>
      <p>Valor Total: R$ <span id="totalValue">0</span></p>
      <p>Valor Perdido (vencido): R$ <span id="lostValue">0</span></p>
      <button onclick="calculateLoss()">Recalcular</button>
    </div>
  </div>

  <script>
    const passwordKey = "EDANA5646";
    const allowedUsers = ["Dr Ed", "Dr Ana", "Gizelle"];
    let currentUser = "";

    // Carregar dados salvos
    window.onload = function() {
      loadTable("patientsTable");
      loadTable("medicationsTable");
      loadTable("materialsTable");
      document.getElementById("totalValue").innerText = localStorage.getItem("totalValue") || "0";
      document.getElementById("lostValue").innerText = localStorage.getItem("lostValue") || "0";
    };

    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      if (allowedUsers.includes(user) && pass === passwordKey) {
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        currentUser = user;
      } else {
        alert("Acesso negado!");
      }
    }

    function addPatient() {
      const table = document.getElementById("patientsTable");
      const row = table.insertRow();
      row.innerHTML = "<td>Novo</td><td contenteditable='true'></td><td contenteditable='true'></td><td contenteditable='true'></td>";
      saveTable("patientsTable");
    }

    function addMedication() {
      const table = document.getElementById("medicationsTable");
      const row = table.insertRow();
      row.innerHTML = "<td contenteditable='true'></td><td contenteditable='true'></td><td contenteditable='true'></td><td contenteditable='true'></td>";
      saveTable("medicationsTable");
    }

    function addMaterial() {
      const table = document.getElementById("materialsTable");
      const row = table.insertRow();
      row.innerHTML = "<td contenteditable='true'></td><td contenteditable='true'></td><td contenteditable='true'></td><td contenteditable='true'></td>";
      saveTable("materialsTable");
    }

    function calculateLoss() {
      let total = 0, lost = 0;
      const meds = document.getElementById("medicationsTable").rows;
      for (let i = 1; i < meds.length; i++) {
        const qty = parseInt(meds[i].cells[1].innerText) || 0;
        const cost = parseFloat(meds[i].cells[3].innerText) || 0;
        total += qty * cost;
        const exp = meds[i].cells[2].innerText;
        if (exp && new Date(exp) < new Date()) {
          lost += qty * cost;
        }
      }
      const mats = document.getElementById("materialsTable").rows;
      for (let i = 1; i < mats.length; i++) {
        const qty = parseInt(mats[i].cells[1].innerText) || 0;
        const cost = parseFloat(mats[i].cells[3].innerText) || 0;
        total += qty * cost;
      }
      document.getElementById("totalValue").innerText = total.toFixed(2);
      document.getElementById("lostValue").innerText = lost.toFixed(2);
      localStorage.setItem("totalValue", total.toFixed(2));
      localStorage.setItem("lostValue", lost.toFixed(2));
    }

    // Funções de salvamento automático
    function saveTable(tableId) {
      const table = document.getElementById(tableId);
      let data = [];
      for (let i = 1; i < table.rows.length; i++) {
        let row = [];
        for (let j = 0; j < table.rows[i].cells.length; j++) {
          row.push(table.rows[i].cells[j].innerText);
        }
        data.push(row);
      }
      localStorage.setItem(tableId, JSON.stringify(data));
    }

    function loadTable(tableId) {
      const table = document.getElementById(tableId);
      const data = JSON.parse(localStorage.getItem(tableId)) || [];
      for (let i = 0; i < data.length
